[versions]
agp = "9.1.1"
kotlin = "2.4.20"
compose-mp = "1.12.0"
compose-material3 = "1.12.0-alpha03"
compose-icons = "1.7.3"
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
coil = "3.3.0"
media3 = "1.8.0"
activity-compose = "1.13.0"
core-ktx = "1.18.0"
mlkit-translate = "17.0.3"
mlkit-langid = "17.0.6"
jflac = "1.5.2"
jlayer = "1.0.1"
jna = "5.14.0"
icu4j = "77.1"
kuromoji = "0.9.0"
materialkolor = "4.1.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-mp" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-mp" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-mp" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-icons" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkit-translate" }
mlkit-langid = { module = "com.google.mlkit:language-id", version.ref = "mlkit-langid" }
jflac = { module = "org.jflac:jflac-codec", version.ref = "jflac" }
jlayer = { module = "javazoom:jlayer", version.ref = "jlayer" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
kuromoji = { module = "com.atilika.kuromoji:kuromoji-ipadic", version.ref = "kuromoji" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-mp = { id = "org.jetbrains.compose", version.ref = "compose-mp" }
